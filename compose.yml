services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flask-app
  flask-app:
    container_name: flask-app
    build: .
    ports:
      - "4000:4000"
