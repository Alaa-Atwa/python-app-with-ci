name: python build and test

on:
  push: 
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest 

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: setup python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'
          
      - name: Install dependencies 
        run: pip install -r requirements.txt 

      - name: run test
        run: pytest

      - name: run lint 
        run: flake8 .
